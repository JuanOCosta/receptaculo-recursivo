<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
{% seo %}
{% feed_meta %}
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/extra.css' | relative_url }}">
{%- if page.slug %}
{%- assign css_ruta = "/assets/css/paginas/" | append: page.slug | append: ".css" %}
{%- assign css_propio = site.static_files | where: "path", css_ruta | first %}
{%- if css_propio %}
<link rel="stylesheet" href="{{ css_ruta | relative_url }}">
{%- endif %}
{%- endif %}
</head>
